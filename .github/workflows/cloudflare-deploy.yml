name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            cat <<'EOF'
          ::error title=Missing CLOUDFLARE_API_TOKEN::GitHub Actions secret CLOUDFLARE_API_TOKEN is not set on abidalista/buildsaudi (Settings → Secrets and variables → Actions). This VM has no Cloudflare login either.

          Add these repo secrets:
            CLOUDFLARE_API_TOKEN  — required
            CLOUDFLARE_ACCOUNT_ID — recommended (Wrangler can infer if the token is single-account)

          Token: Cloudflare dashboard → Manage Account → API Tokens → Create Token
            Start from "Edit Cloudflare Workers", then also grant:
              Account → Cloudflare Workers Scripts → Edit
              Account → Account Settings → Read
              Zone → Zone → Read
              Zone → Workers Routes → Edit
              Zone → DNS → Edit
            Account resource: the account that should own the Worker
            Zone resource: buildsaudi.co (nameservers already josh/phoenix.ns.cloudflare.com)

          Then re-run this workflow (workflow_dispatch or push to main).
          EOF
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Deploy OpenNext Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          # `deploy` does not build; same sequence as package.json "deploy"
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare deploy

      - name: Set Worker runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          SUBSTACK_SID: ${{ secrets.SUBSTACK_SID }}
          PREFERENCES_SECRET: ${{ secrets.PREFERENCES_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          put() {
            local name="$1" val="$2"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$name"
              echo "Set Worker secret $name"
            else
              echo "Skipping Worker secret $name (GitHub secret not set on abidalista/buildsaudi)"
            fi
          }
          put AIRTABLE_API_KEY "$AIRTABLE_API_KEY"
          put AIRTABLE_BASE_ID "$AIRTABLE_BASE_ID"
          put PROXY_SECRET "$PROXY_SECRET"
          put SUBSTACK_SID "$SUBSTACK_SID"
          put PREFERENCES_SECRET "$PREFERENCES_SECRET"

      - name: Resolve workers.dev URL, attach custom domains, smoke-test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          AUTH=( -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" )

          ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -z "$ACCOUNT_ID" ]; then
            ACCOUNT_ID=$(curl -sS "${AUTH[@]}" https://api.cloudflare.com/client/v4/accounts \
              | jq -r '.result[0].id // empty')
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Could not resolve Cloudflare account id. Set GitHub secret CLOUDFLARE_ACCOUNT_ID on abidalista/buildsaudi."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=${ACCOUNT_ID}" >> "$GITHUB_ENV"

          SUB=$(curl -sS "${AUTH[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/subdomain" \
            | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            echo "::error::No workers.dev subdomain on this account. Enable it in the Cloudflare dashboard (Workers → Overview)."
            exit 1
          fi
          WORKER_URL="https://buildsaudi.${SUB}.workers.dev"
          echo "WORKER_URL=${WORKER_URL}" >> "$GITHUB_ENV"
          echo "workers.dev URL: ${WORKER_URL}"
          echo "workers.dev: ${WORKER_URL}" >> "$GITHUB_STEP_SUMMARY"

          echo "## Smoke-test ${WORKER_URL}" >> "$GITHUB_STEP_SUMMARY"
          HOME_STATUS=$(curl -sS -o /tmp/cf-home.html -w "%{http_code}" --max-time 30 "${WORKER_URL}/" || true)
          JOBS_STATUS=$(curl -sS -o /tmp/cf-jobs.html -w "%{http_code}" --max-time 30 "${WORKER_URL}/jobs" || true)
          echo "GET / → ${HOME_STATUS}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "GET /jobs → ${JOBS_STATUS}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$HOME_STATUS" != "200" ] || ! grep -q BUILDSAUDI /tmp/cf-home.html; then
            echo "::error::workers.dev homepage failed (HTTP ${HOME_STATUS}). Not attaching custom domains."
            exit 1
          fi
          if [ "$JOBS_STATUS" != "200" ]; then
            echo "::warning::/jobs returned HTTP ${JOBS_STATUS}"
          fi

          ZONE_JSON=$(curl -sS "${AUTH[@]}" \
            "https://api.cloudflare.com/client/v4/zones?name=buildsaudi.co")
          ZONE_ID=$(echo "$ZONE_JSON" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "Zone buildsaudi.co is not on this Cloudflare account (or token lacks Zone Read)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "workers.dev is live; attach the domain in the dashboard or grant Zone:Read + DNS:Edit + Workers Routes:Edit." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ZONE_ID=${ZONE_ID}" | tee -a "$GITHUB_STEP_SUMMARY"

          attach() {
            local host="$1"
            echo "Attaching custom domain ${host}"
            curl -sS "${AUTH[@]}" -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/domains" \
              --data "{\"hostname\":\"${host}\",\"service\":\"buildsaudi\",\"zone_id\":\"${ZONE_ID}\",\"enabled\":true}" \
              | tee /tmp/cf-domain.json
            echo
            jq -e '.success == true' /tmp/cf-domain.json >/dev/null
          }
          DOMAIN_OK=1
          attach buildsaudi.co || DOMAIN_OK=0
          attach www.buildsaudi.co || DOMAIN_OK=0
          if [ "$DOMAIN_OK" != "1" ]; then
            echo "::warning::Custom domain attach failed. Site is still on ${WORKER_URL}. Need Zone → Workers Routes:Edit and Zone → DNS:Edit on the token."
            echo "custom domain: failed (workers.dev still live)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sleep 8
          APEX_STATUS=$(curl -sS -o /tmp/cf-apex.html -w "%{http_code}" --max-time 30 https://buildsaudi.co/ || true)
          WWW_STATUS=$(curl -sS -o /tmp/cf-www.html -w "%{http_code}" --max-time 30 https://www.buildsaudi.co/ || true)
          echo "GET https://buildsaudi.co/ → ${APEX_STATUS}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "GET https://www.buildsaudi.co/ → ${WWW_STATUS}" | tee -a "$GITHUB_STEP_SUMMARY"
